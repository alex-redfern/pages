<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Critter Classroom</title>
  <meta name="description" content="A gentle maths game: practise column addition, subtraction, times tables and division, and build your own classroom.">
  <meta name="theme-color" content="#FFF8EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Critters">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply the saved light/dark choice before the page draws, so it doesn't flash.
    try { var t = localStorage.getItem('critter-classroom-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app"></main>
  <noscript>Critter Classroom needs JavaScript turned on.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
